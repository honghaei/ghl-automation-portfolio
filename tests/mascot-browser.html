<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V16 mascot QA</title>
<style>body{margin:0;background:#091321;color:#eaf5ff;font:14px system-ui} header{padding:15px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,select{padding:9px}pre{padding:12px;white-space:pre-wrap}iframe{height:900px;border:1px solid #468;display:block;background:#050e1c}#framewrap{overflow:auto;width:100%;height:930px}</style>
<header><b>Local V16 QA</b><label>Viewport <select id="width"><option>1280</option><option>1920</option><option>1440</option><option>1024</option><option>768</option><option>390</option><option>320</option></select></label><label>Scale <select id="zoom"><option>100%</option><option>80%</option><option>90%</option><option>125%</option></select></label><button id="reload">Restart intro</button><button id="functional">Run lifecycle & speech mocks</button><button id="layout">Run layout matrix</button><button id="reduced">Reduced motion check</button></header>
<pre id="results" role="status">Ready. The iframe below loads the actual homepage.</pre><div id="framewrap"><iframe id="page" title="Portfolio test viewport" src="/"></iframe></div>
<script type="module">
const page=document.querySelector('#page'),results=document.querySelector('#results');
const width=document.querySelector('#width'),zoom=document.querySelector('#zoom');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const log=s=>results.textContent+='\n'+s;
function size(){page.style.width=width.value+'px';page.style.zoom=parseFloat(zoom.value)/100;}
width.onchange=zoom.onchange=size;size();
document.querySelector('#reload').onclick=()=>page.contentWindow.location.reload();
const assert=(ok,label)=>{if(!ok)throw Error('FAIL: '+label);log('PASS: '+label)};
const read=()=>page.contentDocument;
async function until(fn,ms=24000){const start=Date.now();while(!fn()){if(Date.now()-start>ms)throw Error('timeout');await wait(30)}}
async function fixture(mode='allowed'){
 const marker=Date.now();page.src='/tests/mascot-fixture.html?mode='+mode+'&t='+marker;await until(()=>read()?.URL.includes('t='+marker)&&read()?.querySelector('.talking-mascot'));return read();}
function pointer(doc,target,type,event){target.dispatchEvent(new doc.defaultView.PointerEvent(event,{pointerType:type,bubbles:true}));}
document.querySelector('#functional').onclick=async()=>{results.textContent='Functional suite (controlled speech API, native speech tested separately)';try{
 let doc=await fixture('allowed');let win=doc.defaultView;await until(()=>doc.querySelector('.talking-mascot').dataset.state==='greeting');
 let char=doc.querySelector('.mascot-character');pointer(doc,char,'mouse','pointerover');char.focus();char.click();
 assert(!doc.querySelector('.mascot-bubble--inquiry'),'hover, focus and click cannot reveal inquiry during intro');
 char.blur();doc.querySelector('.mascot-audio-toggle').click();await until(()=>doc.querySelector('.mascot-body').dataset.speaking==='true');
 assert(doc.querySelector('.mascot-face-rig').dataset.mouth!==undefined,'speech onstart activates face rig');
 await wait(300);const a=doc.querySelector('.mascot-face-rig').dataset.mouth;await wait(190);const b=doc.querySelector('.mascot-face-rig').dataset.mouth;assert(a!=='rest'||b!=='rest','mouth animates during actual mocked speech');
 const states=new Set(['greeting']);const sample=setInterval(()=>states.add(doc.querySelector('.talking-mascot')?.dataset.state),30);
 await until(()=>doc.querySelector('.talking-mascot').dataset.introComplete==='true');clearInterval(sample);states.add(doc.querySelector('.talking-mascot').dataset.state);
 assert(['greeting','explaining','closing','idle'].every(s=>states.has(s)),'all initial poses and return to idle ('+[...states].join(', ')+')');
 assert(!doc.querySelector('.mascot-bubble--inquiry'),'completion alone keeps inquiry hidden');
 assert(doc.querySelector('.mascot-face-rig').dataset.mouth==='rest','mouth rests after speech end');
 pointer(doc,char,'mouse','pointerout');pointer(doc,char,'mouse','pointerover');await wait(50);
 assert(!!doc.querySelector('.mascot-bubble--inquiry'),'post-intro hover opens inquiry');
 assert(doc.querySelector('.mascot-contact').getAttribute('href')==='#contact','contact CTA uses existing section');
 await wait(320);pointer(doc,char,'mouse','pointerout');await wait(50);
 assert(!doc.querySelector('.mascot-bubble--inquiry'),'mouse leave dismisses inquiry');
 assert(doc.querySelector('.mascot-body').dataset.speaking==='false','mouse leave stops speech and mouth');
 char.focus();await wait(50);assert(!!doc.querySelector('.mascot-bubble--inquiry'),'keyboard focus opens inquiry');
 char.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(30);assert(!doc.querySelector('.mascot-bubble--inquiry'),'Escape dismisses inquiry');char.blur();
 pointer(doc,char,'touch','pointerdown');char.focus();char.dispatchEvent(new win.MouseEvent('click',{detail:1,bubbles:true}));await wait(30);assert(!!doc.querySelector('.mascot-bubble--inquiry'),'touch tap opens inquiry despite focus event');
 pointer(doc,char,'touch','pointerdown');char.dispatchEvent(new win.MouseEvent('click',{detail:1,bubbles:true}));await wait(30);assert(!doc.querySelector('.mascot-bubble--inquiry'),'second touch tap closes inquiry');char.blur();
 const starts=win.qaSpeech.starts;for(let i=0;i<4;i++){pointer(doc,char,'mouse','pointerover');await wait(40);pointer(doc,char,'mouse','pointerout');await wait(40)}await wait(280);assert(win.qaSpeech.starts===starts,'rapid hover does not restart speech');
 doc.querySelector('.mascot-audio-toggle').click();await wait(50);assert(doc.querySelector('.mascot-body').dataset.speaking==='false','mute leaves mouth at rest');
 doc=await fixture('blocked');await until(()=>doc.querySelector('.talking-mascot').dataset.state==='greeting');doc.querySelector('.mascot-audio-toggle').click();await wait(1900);assert(doc.querySelector('.mascot-audio-toggle').getAttribute('aria-pressed')==='false','blocked/no-start speech returns to opt-in audio');assert(doc.querySelector('.mascot-body').dataset.speaking==='false','blocked audio does not move mouth');await until(()=>doc.querySelector('.talking-mascot').dataset.introComplete==='true');assert(!doc.querySelector('.mascot-bubble--inquiry'),'blocked speech still completes caption sequence without inquiry');
 doc=await fixture('error');await until(()=>doc.querySelector('.talking-mascot').dataset.state==='greeting');doc.querySelector('.mascot-audio-toggle').click();await wait(150);assert(doc.querySelector('.mascot-body').dataset.speaking==='false','speech error keeps mouth at rest');assert(doc.querySelector('.mascot-bubble').textContent.includes('Hi!'),'speech error retains visible captions');
 doc=await fixture('long');await until(()=>doc.querySelector('.talking-mascot').dataset.state==='greeting');doc.querySelector('.mascot-audio-toggle').click();await wait(2800);assert(doc.querySelector('.talking-mascot').dataset.state==='greeting' && doc.querySelector('.mascot-body').dataset.speaking==='true','actual onend controls slow speech rather than caption estimate');
 const before=doc.defaultView.qaSpeech.cancels;doc.querySelector('#unmount').click();await wait(50);assert(!doc.querySelector('.talking-mascot') && doc.defaultView.qaSpeech.cancels>before,'unmount cancels active speech and removes component');
 log('DONE: functional suite');}catch(e){log(e.stack)}};
document.querySelector('#layout').onclick=async()=>{results.textContent='Actual homepage layout matrix, iframe widths × CSS zoom (not browser toolbar zoom)';try{page.src='/';await until(()=>read()?.querySelector('.talking-mascot'));await wait(300);
 for(const w of [1920,1440,1280,1024,768,390,320])for(const z of [0.8,0.9,1,1.25]){page.style.width=w+'px';page.style.zoom=z;await wait(60);const doc=read(),r=doc.querySelector('.talking-mascot').getBoundingClientRect(),hero=doc.querySelector('.portfolio-hero-copy').getBoundingClientRect();assert(r.left>=0 && r.right<=doc.documentElement.clientWidth+1,`${w}px / ${z*100}% mascot inside viewport`);assert(!((r.left<hero.right&&r.right>hero.left)&&(r.top<hero.bottom&&r.bottom>hero.top)),`${w}px / ${z*100}% no hero text overlap`);}
 page.style.width='390px';page.style.zoom=1;log('DONE: 28 layout combinations.');}catch(e){log(e.stack)}};
document.querySelector('#reduced').onclick=async()=>{results.textContent='Reduced motion fixture';try{page.src='/tests/mascot-fixture.html?mode=reduced&t='+Date.now();await until(()=>read()?.URL.includes('mode=reduced')&&read()?.querySelector('.talking-mascot'));const doc=read();const rules=[...doc.styleSheets].flatMap(s=>[...s.cssRules]);assert(rules.some(r=>r.conditionText?.includes('prefers-reduced-motion')&&/animation:[^;]*none/.test(r.cssText)),'reduced-motion media rule exists and disables animation (OS toggle not emulated)');log('DONE');}catch(e){log(e.stack)}};
</script></html>
