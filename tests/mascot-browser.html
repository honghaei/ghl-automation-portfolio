<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V16.2 mascot playback regression</title><style>body{margin:0;background:#071524;color:white;font:14px system-ui}header,pre{padding:14px}button{padding:10px}pre{white-space:pre-wrap}iframe{width:600px;height:900px;border:1px solid #456}</style><header><button id="run">Run MP3 interaction regressions</button></header><pre id="results" role="status">Ready. Controlled media transport; real MP3 checks are separate.</pre><iframe id="page" title="Mascot regression fixture" src="/tests/mascot-fixture.html?mode=allowed"></iframe>
<script type="module">
const frame=document.querySelector('#page'),out=document.querySelector('#results');const wait=ms=>new Promise(r=>setTimeout(r,ms));const log=s=>out.textContent+='\n'+s;function assert(ok,s){if(!ok)throw Error('FAIL: '+s);log('PASS: '+s)}async function until(fn,ms=18000){const at=Date.now();while(!fn()){if(Date.now()-at>ms)throw Error('timeout');await wait(20)}}
async function fixture(mode){const id=Date.now();frame.src='/tests/mascot-fixture.html?mode='+mode+'&t='+id;await until(()=>frame.contentDocument?.URL.includes('t='+id)&&frame.contentDocument?.querySelector('.talking-mascot'));return frame.contentDocument}
const pointer=(d,e,type,event)=>e.dispatchEvent(new d.defaultView.PointerEvent(event,{pointerType:type,bubbles:true}));
document.querySelector('#run').onclick=async()=>{out.textContent='V16.2 media-backed component regressions';try{
 let d=await fixture('allowed'),w=d.defaultView;await until(()=>d.querySelector('.talking-mascot').dataset.state==='greeting');let root=d.querySelector('.talking-mascot'),a=d.querySelector('audio'),c=d.querySelector('.mascot-character'),voice=d.querySelector('.mascot-audio-toggle');
 assert(w.qaMedia.plays===0&&a.paused,'initial captions do not attempt audible autoplay');pointer(d,c,'mouse','pointerover');c.focus({preventScroll:true});c.click();assert(!d.querySelector('.mascot-bubble--inquiry'),'hover/focus/tap during initial intro cannot open inquiry');c.blur();
 voice.click();assert(a.currentTime<.15,'Voice on synchronously starts the full MP3 at zero');await until(()=>root.dataset.audioPhase==='playing');assert(root.dataset.state==='greeting','Voice on restarts the greeting pose/caption');assert(d.querySelectorAll('audio').length===1,'one authoritative audio element');
 const pauses=w.qaMedia.pauses,at=a.currentTime;w.scrollTo({top:450,behavior:'instant'});await wait(160);assert(a.currentTime>at&&!a.paused&&w.qaMedia.pauses===pauses,'immediate scrolling away does not pause or reset audio');w.scrollTo({top:0,behavior:'instant'});await wait(80);assert(!a.paused,'scrolling back keeps audio active');
 a.currentTime=7;await wait(40);voice.click();await wait(90);assert(a.paused&&root.dataset.audioPhase==='silent','mute halfway stops audio while captions continue');assert(d.querySelector('.mascot-face-rig').dataset.mouth==='rest','mute rests the mouth');
 voice.click();await until(()=>root.dataset.audioPhase==='playing');assert(a.currentTime<.4&&root.dataset.state==='greeting','unmute restarts complete intro, not the middle');const run=root.dataset.audioRun;d.querySelector('#rerender').click();await wait(70);assert(root.dataset.audioRun===run&&!a.paused,'React rerender preserves active audio/timeline');
 const poses=new Set(['greeting']),mouths=new Set();const sample=setInterval(()=>{poses.add(root.dataset.state);mouths.add(d.querySelector('.mascot-face-rig')?.dataset.mouth)},35);await until(()=>root.dataset.introComplete==='true');clearInterval(sample);poses.add(root.dataset.state);
 assert(['greeting','explaining','closing','idle'].every(s=>poses.has(s)),'all approved intro poses follow media time and return to idle');assert(mouths.size>=3,'recording time/amplitude produces multiple mouth shapes');assert(!d.querySelector('.mascot-bubble--inquiry'),'intro completion alone does not reveal inquiry');assert(d.querySelector('.mascot-face-rig').dataset.mouth==='rest','natural audio end rests the mouth');
 c.focus({preventScroll:true});await wait(60);assert(root.dataset.state==='thinking'&&!!d.querySelector('.mascot-bubble--inquiry'),'post-intro keyboard focus opens Think inquiry');assert(a.src.includes('mascot-inquiry.mp3')&&!a.paused,'enabled voice starts approved inquiry MP3');assert(d.querySelector('.mascot-bubble .mascot-contact').getAttribute('href')==='#contact','inquiry retains existing contact CTA');
 const inqAt=a.currentTime;c.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));c.blur();await wait(60);assert(!d.querySelector('.mascot-bubble--inquiry'),'Escape dismisses cloud');assert(!a.paused&&a.currentTime>inqAt,'dismissing inquiry does not cancel its active recording');w.scrollTo({top:600,behavior:'instant'});const t=a.currentTime;await wait(100);assert(!a.paused&&a.currentTime>t,'inquiry audio continues while scrolling away');
 const plays=w.qaMedia.plays;for(let i=0;i<3;i++){pointer(d,c,'mouse','pointerover');await wait(30);pointer(d,c,'mouse','pointerout')}await wait(230);assert(w.qaMedia.plays===plays,'rapid hover/re-entry cannot restart active/cooldown inquiry');assert(!d.querySelector('.mascot-bubble--inquiry'),'mouse leave dismisses inquiry cloud');
 voice.click();await wait(40);c.focus({preventScroll:true});await wait(40);const before=a.currentTime;voice.click();assert(a.currentTime<.2&&a.src.includes('inquiry'),'Voice on while inquiry is open restarts inquiry at zero');await wait(50);assert(!a.paused,'explicit inquiry activation can play again despite cooldown');c.blur();voice.click();await wait(60);
 pointer(d,c,'touch','pointerdown');c.focus({preventScroll:true});c.dispatchEvent(new w.MouseEvent('click',{detail:1,bubbles:true}));await wait(30);assert(!!d.querySelector('.mascot-bubble--inquiry'),'mobile tap opens inquiry');pointer(d,c,'touch','pointerdown');c.dispatchEvent(new w.MouseEvent('click',{detail:1,bubbles:true}));await wait(30);assert(!d.querySelector('.mascot-bubble--inquiry'),'second tap dismisses inquiry');c.blur();
 for(let i=0;i<6;i++){voice.click();voice.click()}await wait(80);assert(w.qaMedia.maxActive===1,'rapid toggles never overlap playback');assert(a.paused&&d.querySelector('.mascot-face-rig').dataset.mouth==='rest','rapid toggles leave muted playback and resting mouth');
 w.scrollTo({top:500,behavior:'instant'});const y=w.scrollY;voice.click();await wait(80);assert(w.scrollY===y,'Voice on never automatically scrolls visitor back');w.dispatchEvent(new w.PageTransitionEvent('pagehide'));await wait(30);assert(a.paused,'page navigation lifecycle stops audio');voice.click();await wait(30);d.querySelector('#unmount').click();await wait(30);assert(a.paused&&w.qaMedia.active===0&&!d.querySelector('.talking-mascot'),'unmount/navigation cleanup stops audio');
 d=await fixture('denied');await until(()=>d.querySelector('.mascot-bubble'));d.querySelector('.mascot-audio-toggle').click();await wait(70);assert(d.querySelector('.mascot-playback-feedback').textContent.includes('blocked'),'denied playback has visible retry state');assert(d.querySelector('.mascot-body').dataset.speaking==='false'&&d.querySelector('.mascot-bubble'),'denied playback retains captions and resting mouth');
 d=await fixture('broken');await until(()=>d.querySelector('.mascot-bubble'));d.querySelector('.mascot-audio-toggle').click();await wait(70);assert(d.querySelector('.mascot-playback-feedback').textContent.includes('could not be played'),'missing/unavailable audio has visible retry error');assert(d.querySelector('.mascot-audio-toggle').getAttribute('aria-pressed')==='false','failed playback returns to Voice on');log('DONE: MP3 component regressions');
 }catch(e){log(e.stack)}};
</script></html>
