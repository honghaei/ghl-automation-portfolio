<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chovy tour acceptance tests</title><style>body{margin:0;background:#061322;color:#eaf7ff;font:14px system-ui}header{padding:12px;display:flex;gap:10px;flex-wrap:wrap}button,select{padding:9px;font:inherit}pre{padding:12px;white-space:pre-wrap;max-height:160px;overflow:auto}iframe{border:1px solid #456;display:block;background:#030c17}#surface{overflow:auto;max-height:980px}</style>
<header><button id="layout">Run responsive tour & card checks</button><button id="native">Run real video & voice-priority checks</button><button id="fullscreen">Fullscreen player</button><button id="show">Show video section</button><label>Viewport <select id="size"><option>1440×900</option><option>1024×768</option><option>834×900</option><option>393×652</option><option>390×724</option><option>320×568</option><option>844×390</option></select></label></header>
<pre id="results" role="status">Ready. Uses the actual homepage and local finished MP4. Viewport/CSS zoom simulations do not replace physical iOS tests.</pre><div id="surface"><iframe id="page" title="Actual portfolio under test" src="/"></iframe></div>
<script type="module">
const frame=document.querySelector('#page'),out=document.querySelector('#results'),sleep=ms=>new Promise(r=>setTimeout(r,ms));const log=s=>out.textContent+='\n'+s;function assert(ok,s){if(!ok)throw Error('FAIL: '+s);log('PASS: '+s)}const near=(a,b)=>Math.abs(a-b)<1.6;
function size(w,h,z=1){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.zoom=z}size(1440,900);
async function until(fn,ms=16000){const at=Date.now();while(!fn()){if(Date.now()-at>ms)throw Error('timeout waiting for '+fn.toString().slice(0,130));await sleep(35)}}
async function load(){sessionStorage.removeItem('portfolio:last-case-origin:v6');sessionStorage.removeItem('portfolio:visited-case-study:v6');const id=Date.now();frame.src='/?chovy-qa='+id;await until(()=>frame.contentDocument?.URL.includes('chovy-qa='+id)&&frame.contentDocument.querySelector('.chovy-tour-section'));await frame.contentDocument.fonts.ready;await sleep(1200);return frame.contentDocument}
function show(){const d=frame.contentDocument,r=d.querySelector('.chovy-tour-section').getBoundingClientRect(),nav=d.querySelector('.portfolio-navbar-wrap').getBoundingClientRect();d.defaultView.scrollBy({top:r.top-nav.bottom-4,behavior:'instant'})}
document.querySelector('#show').onclick=show;document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split('×').map(Number);size(w,h);show()};
document.querySelector('#fullscreen').onclick=()=>{const d=frame.contentDocument,v=d.querySelector('.chovy-tour-section video');v.requestFullscreen().then(()=>assert(d.fullscreenElement===v,'actual fullscreen request succeeds in Chrome')).catch(e=>log('LIMIT: fullscreen '+e.message))};
document.querySelector('#layout').onclick=async()=>{out.textContent='Actual homepage responsive tour, ordering and expertise alignment';try{size(1440,900);const d=await load(),w=d.defaultView,v=d.querySelector('.chovy-tour-section video');assert(v.paused&&v.currentTime===0&&!v.autoplay,'tour does not autoplay');assert(v.preload==='none'&&v.readyState===0,'video is not loaded on initial entry');assert(!w.performance.getEntriesByType('resource').some(r=>r.name.endsWith('.mp4')),'no MP4 fetch before playback');assert(v.controls&&v.playsInline,'native controls and inline playback enabled');assert(d.querySelector('track[kind=captions]').default,'English closed captions enabled by default');assert(d.querySelectorAll('.chovy-tour-chapters button').length===11,'all 11 recording-based chapters present');
const tour=d.querySelector('.chovy-tour-section'),mascot=d.querySelector('.talking-mascot'),copy=d.querySelector('.portfolio-hero-copy'),grid=d.querySelector('.portfolio-focus-grid');assert(tour.previousElementSibling===mascot&&tour.nextElementSibling===grid,'AI Voice section immediately follows hero presentation and precedes expertise cards');assert(d.querySelector('.mascot-contact')?.getAttribute('href')==='#contact'||!d.querySelector('.mascot-contact'),'existing mascot contact destination preserved');
let cases=0;for(const[width,height]of [[1920,1080],[1440,900],[1280,800],[1100,800],[1024,768],[834,900],[768,900],[600,700],[430,760],[393,652],[390,724],[375,667],[320,568],[844,390]])for(const z of [.8,.9,1,1.25]){size(width,height,z);await sleep(90);const label=width+'×'+height+' / CSS '+z*100+'%',a=tour.getBoundingClientRect(),m=mascot.getBoundingClientRect(),c=copy.getBoundingClientRect(),g=grid.getBoundingClientRect();assert(a.top>=Math.max(m.bottom,c.bottom)+20&&g.top>=a.bottom+20,label+' section stays below hero and above cards');assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,label+' no horizontal overflow');const r=d.querySelector('.chovy-tour-video-frame').getBoundingClientRect();assert(near(r.width/r.height,16/9),label+' video aspect ratio stays 16:9');assert(r.width>0&&r.left>=0&&r.right<=width+1,label+' video stays inside viewport width');assert(w.getComputedStyle(d.querySelector('.chovy-tour-grid')).gridTemplateColumns.split(' ').length===(width>1100?2:1),label+' responsive video/chapter columns');const cols=width>1100?4:width>540?2:1;assert(w.getComputedStyle(grid).gridTemplateColumns.split(' ').length===cols,label+' expertise column count');const cards=[...grid.children];for(let i=0;i<4;i+=cols){const row=cards.slice(i,i+cols),rs=row.map(e=>e.getBoundingClientRect());assert(rs.every(r=>near(r.height,rs[0].height)),label+' equal card heights');for(const selector of ['.portfolio-focus-icon','h3','p']){const ys=row.map(e=>e.querySelector(selector).getBoundingClientRect().top-e.getBoundingClientRect().top);assert(ys.every(y=>near(y,ys[0])),label+' aligned '+selector)}const bottoms=row.map(e=>e.getBoundingClientRect().bottom-e.querySelector('.portfolio-chip-row').getBoundingClientRect().bottom);assert(bottoms.every(y=>near(y,bottoms[0])),label+' bottom-aligned skill tags')}const contact=d.querySelector('.portfolio-contact-panel'), cr=contact.getBoundingClientRect();assert(cr.left>=0&&cr.right<=width+1,label+' contact fits viewport');assert([...contact.querySelectorAll('a,button,h2,p')].every(e=>e.scrollWidth<=e.clientWidth+1),label+' contact has no clipped text');const vb=d.querySelector('.chovy-tour-video-frame').getBoundingClientRect(),cb=d.querySelector('.chovy-tour-caption-bar').getBoundingClientRect(),nb=d.querySelector('.chovy-tour-chapters').getBoundingClientRect();assert(cb.top>=vb.bottom-1,label+' captions never overlay video content');assert(width<=1100||near(nb.top,vb.top),label+' player and chapters align at top');assert([...d.querySelectorAll('.chovy-tour-chapters button')].every(e=>e.scrollWidth<=e.clientWidth+1),label+' chapter labels wrap without clipping');cases++}
const details=d.querySelector('.chovy-tour-transcript');details.open=true;assert(details.textContent.includes('Pengpeng')&&!/Pehng|Pangpang/.test(details.textContent),'transcript uses correct Pengpeng spelling');assert(details.querySelectorAll('section').length===11,'complete 11-scene transcript available');details.open=false;size(1440,900);show();log('DONE: '+cases+' responsive combinations. CSS zoom simulations, not native browser zoom.');}catch(e){log(e.stack)}};
document.querySelector('#native').onclick=async()=>{out.textContent='Native finished MP4, captions, chapters and media priority';try{size(1440,900);const d=await load(),w=d.defaultView,v=d.querySelector('.chovy-tour-section video'),a=d.querySelector('.talking-mascot audio'),voice=d.querySelector('.mascot-audio-toggle'),buttons=[...d.querySelectorAll('.chovy-tour-chapters button')];assert(v.paused&&v.currentTime===0,'initial video stays paused');voice.click();await until(()=>!a.paused&&a.currentTime>.12,5000);assert(!a.paused,'homepage approved mascot MP3 plays before tour');buttons[0].click();await until(()=>!v.paused&&v.currentTime>.2,15000);assert(a.paused&&voice.disabled,'starting actual tour stops mascot audio and locks voice priority');assert(v.currentSrc.split('?')[0].endsWith('Chovy_Portfolio_Guided_Tour_Web.mp4'),'actual finished local web MP4 selected');assert(v.videoWidth===1920&&v.videoHeight===1080,'native video decoder reports 1920×1080');assert(Math.abs(v.duration-234.4)<.1,'actual video duration matches 11 recordings');assert(!v.muted&&v.volume>0,'actual video plays with audio enabled');
const t=v.currentTime;w.scrollTo({top:4000,behavior:'instant'});await sleep(450);assert(!v.paused&&v.currentTime>t&&a.paused,'video keeps playing while scrolling; no mascot overlap');v.pause();await sleep(100);assert(!voice.disabled&&a.paused,'pause releases priority without restarting mascot');await v.play();await sleep(100);assert(voice.disabled&&a.paused,'resume reclaims priority');v.muted=true;assert(v.muted,'native video mute works');v.muted=false;v.volume=.5;assert(!v.muted&&v.volume===.5,'native volume and unmute work');v.volume=1;
await until(()=>v.textTracks.length&&v.textTracks[0].cues?.length,7000);const track=v.textTracks[0];assert(track.mode==='hidden'&&track.cues.length>=60,'English VTT cues load into the reserved inline caption rail');assert([...track.cues].some(c=>c.text.includes('Pengpeng'))&&![...track.cues].some(c=>/Pehng|Pangpang/.test(c.text)),'captions display correct Pengpeng spelling');
const cc=d.querySelector('.chovy-tour-cc');cc.click();await until(()=>cc.getAttribute('aria-pressed')==='false');assert(track.mode==='disabled'&&cc.getAttribute('aria-pressed')==='false','CC switches off');cc.click();await until(()=>cc.getAttribute('aria-pressed')==='true');assert(track.mode==='hidden'&&cc.getAttribute('aria-pressed')==='true','CC restores reserved caption rail');await until(()=>d.querySelector('.chovy-tour-caption').textContent.length>0);assert(d.querySelector('.chovy-tour-caption-bar').getBoundingClientRect().top>=v.getBoundingClientRect().bottom-1,'actual caption text stays outside the video');track.mode='showing';await until(()=>track.mode==='hidden');assert(track.mode==='hidden','native CC selection cannot duplicate inline captions');for(let i=0;i<buttons.length;i++){buttons[i].click();await until(()=>!v.seeking&&!v.paused,5000);const before=v.currentTime;await sleep(180);assert(v.currentTime>before&&a.paused&&voice.disabled,'chapter '+(i+1)+' seeks and plays with exclusive voice priority');assert(buttons[i].getAttribute('aria-current')==='true','chapter '+(i+1)+' highlight matches playback')}
v.pause();await sleep(80);voice.click();await until(()=>!a.paused&&a.currentTime>.1,5000);a.currentTime=15.25;await until(()=>d.querySelector('.talking-mascot').dataset.introComplete==='true',2500);d.querySelector('.mascot-character').focus({preventScroll:true});await until(()=>a.currentSrc.endsWith('mascot-inquiry.mp3')&&!a.paused,5000);assert(!!d.querySelector('.mascot-bubble--inquiry'),'approved inquiry remains functional when tour is paused');await v.play();await sleep(120);assert(a.paused&&voice.disabled,'tour also interrupts inquiry audio cleanly');
v.currentTime=v.duration-.22;await until(()=>v.ended,2500);await sleep(100);assert(!voice.disabled&&a.paused,'natural video end releases priority and never restarts mascot');
const source=v.querySelector('source'),good=source.src;source.src='/missing-chovy-tour-fixture.mp4';v.load();v.play().catch(()=>{});await until(()=>d.querySelector('.chovy-tour-feedback').textContent.includes('could not load'),7000);assert(!voice.disabled&&!!d.querySelector('.chovy-tour-feedback button'),'actual missing video shows retry and releases audio priority');source.src=good;d.querySelector('.chovy-tour-feedback button').click();await until(()=>!v.paused&&v.currentTime>.1,15000);assert(voice.disabled,'Retry video recovers actual playback and priority');
const old=v;frame.src='/ghl-project/flowdesk-support-ticketing-automation';await until(()=>frame.contentDocument?.querySelector('.fd-case-page'));assert(old.paused,'leaving homepage stops the detached tour element');assert(!frame.contentDocument.querySelector('.chovy-tour-section')&&!frame.contentDocument.querySelector('.talking-mascot'),'tour and mascot remain homepage-only');log('DONE: real finished video checks. Chapters/end use actual native seeking; physical iOS/Messenger not tested.');}catch(e){log(e.stack)}};
</script></html>
