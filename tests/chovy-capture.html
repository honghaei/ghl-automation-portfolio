<!doctype html><html><meta charset="utf-8"><title>Chovy authentic portfolio footage capture</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:1600px;background:#040c17;color:white;font:14px system-ui}#toolbar{height:72px;display:flex;gap:12px;align-items:center;padding:12px}button,select{font:inherit;padding:8px}iframe{display:block;width:1600px;height:900px;border:0}#status{max-width:450px}</style>
<div id="toolbar"><button id="prev">Previous shot</button><select id="shots" aria-label="Shot"></select><button id="load">Load shot</button><button id="record">Record motion</button><button id="step">Next capture frame</button><button id="next">Next shot</button><span id="status">Loading plan…</span></div><iframe id="page" title="Actual portfolio capture viewport"></iframe>
<script type="module">
const plan=await(await fetch('/tests/chovy-capture-plan.json')).json(),f=document.querySelector('#page'),select=document.querySelector('#shots'),status=document.querySelector('#status');let i=0,meta={},step=0,baseY=0;for(const s of plan.shots){const o=document.createElement('option');o.value=s.id-1;o.textContent=String(s.id).padStart(2,'0')+' — '+s.label;select.append(o)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));async function until(fn){const t=Date.now();while(!fn()){if(Date.now()-t>16000)throw Error('page load timeout');await wait(40)}}
function info(){const d=f.contentDocument,s=plan.shots[i],w=d.defaultView;let target=d.querySelector(s.point)||d.querySelector(s.selector)||d.querySelector('h1');if(s.scene===5){const index=Math.min(3,Math.floor(Number(document.body.dataset.elapsed||0)/1000));target=d.querySelectorAll('.portfolio-focus-card')[index]||target}const modalImage=d.querySelector('[role=dialog] img');if(modalImage)target=modalImage;const r=target?.getBoundingClientRect();meta={shot:s.id,scene:s.scene,label:s.label,modal:!!modalImage,path:w.location.pathname,scrollY:w.scrollY,visibleText:d.body.innerText,activeEvidence:[...d.querySelectorAll('.lss-sticky .lss-proof-image')].filter(e=>{const r=e.getBoundingClientRect();return r.top<900&&r.bottom>120}).map(e=>({label:e.closest('.lss-proof')?.querySelector('.lss-proof-label')?.textContent,title:e.closest('.lss-proof')?.querySelector('.lss-proof-title')?.textContent,image:e.querySelector('img')?.getAttribute('src')})),important:[...d.querySelectorAll('.chovy-tour-heading,.chovy-tour-video-frame,.chovy-tour-technology,.chovy-tour-chapters,.portfolio-contact-panel,.portfolio-contact-actions')].map(e=>{const r=e.getBoundingClientRect();return{selector:e.className,x:r.x,y:r.y,width:r.width,height:r.height}}),target:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null,fixed:[...d.querySelectorAll('.portfolio-navbar-wrap,.lss-sticky,.lsp-capability-sticky')].map(e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}}).filter(r=>r.y<900&&r.y+r.height>0),cards:[...d.querySelectorAll(s.scene===5?'.portfolio-focus-card':'.portfolio-skill-card')].map(e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}}),clock:performance.now()};document.body.dataset.metadata=JSON.stringify(meta);return meta}
async function load(){const controls=[...document.querySelectorAll('#toolbar button,#toolbar select')];controls.forEach(e=>e.disabled=true);try{document.body.dataset.ready='loading';status.textContent='Loading actual project…';const s=plan.shots[i];select.value=i;
if(f.contentWindow?.location.pathname!==s.route){const link=f.contentDocument?.querySelector(`a[href="${s.route}"]`);if(link){link.target='_self';link.click()}else f.src=s.route+'?chovy-capture=1';await until(()=>f.contentDocument?.readyState==='complete'&&f.contentDocument.querySelector('h1')&&f.contentWindow.location.pathname===s.route)}
const d=f.contentDocument;await d.fonts.ready;await wait(900);d.querySelector('.fd-lightbox-close')?.click();let css=d.querySelector('#capture-style');if(!css){css=d.createElement('style');css.id='capture-style';css.textContent='.talking-mascot{visibility:hidden!important;pointer-events:none!important}html{scroll-behavior:auto!important;scrollbar-width:none!important}::-webkit-scrollbar{display:none!important}';d.head.append(css)}
let e=d.querySelector(s.selector);if(!e){status.textContent='MISSING '+s.selector;document.body.dataset.ready='missing';return}
const r=e.getBoundingClientRect();let y=Math.max(0,d.defaultView.scrollY+r.top-132);if(s.selector==='nav'||s.selector.includes('hero')||s.selector.includes('navbar'))y=0;d.defaultView.scrollTo({top:y,behavior:'instant'});await wait(700);
if(s.showcase_step!==null){const root=e.matches('.lss-scrollscape')?e:e.querySelector('.lss-scrollscape');const b=root?.querySelectorAll('.lss-chapter-button')[s.showcase_step];if(!b)throw Error('Missing requested showcase step '+s.showcase_step);if(b){b.click();await until(()=>b.getAttribute('aria-current')==='step');await wait(500)}}
await wait(500);if(s.inspect){e.querySelector('.lss-sticky .lss-proof-image')?.click();await wait(300)}
await Promise.all([...d.images].filter(img=>{const r=img.getBoundingClientRect();return r.bottom>0&&r.top<900}).map(img=>img.decode().catch(()=>{})));step=0;baseY=d.defaultView.scrollY;document.body.dataset.elapsed='0';document.body.dataset.ready='ready';info();status.textContent='Ready: '+s.label;
}catch(e){status.textContent=e.message;document.body.dataset.ready='error'}finally{controls.forEach(e=>e.disabled=false)}}
function record(){const d=f.contentDocument,s=plan.shots[i],y=d.defaultView.scrollY,start=performance.now();document.body.dataset.ready='recording';function tick(now){const elapsed=now-start,p=Math.min(1,elapsed/4000),ease=(1-Math.cos(p*Math.PI))/2;d.defaultView.scrollTo({top:y+s.scroll_delta*ease,behavior:'instant'});document.body.dataset.elapsed=String(elapsed);info();if(p<1)requestAnimationFrame(tick);else{document.body.dataset.ready='recorded';status.textContent='Captured motion: '+s.label}}requestAnimationFrame(tick)}
document.querySelector('#step').onclick=async()=>{step=Math.min(8,step+1);const d=f.contentDocument,s=plan.shots[i],p=step/8,ease=(1-Math.cos(p*Math.PI))/2;d.defaultView.scrollTo({top:baseY+s.scroll_delta*ease,behavior:'instant'});document.body.dataset.elapsed=String(p*4000);await wait(120);info();status.textContent='Capture '+s.id+' / frame '+step;};
document.querySelector('#load').onclick=()=>{i=Number(select.value);load()};document.querySelector('#next').onclick=()=>{i=Math.min(plan.shots.length-1,i+1);load()};document.querySelector('#prev').onclick=()=>{i=Math.max(0,i-1);load()};document.querySelector('#record').onclick=record;await load();
</script></html>
