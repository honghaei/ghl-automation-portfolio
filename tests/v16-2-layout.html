<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V16.2 layout and native media acceptance</title><style>body{margin:0;background:#071626;color:#eef7ff;font:14px system-ui}header{padding:12px;display:flex;flex-wrap:wrap;gap:10px}button,select{padding:9px}pre{padding:12px;white-space:pre-wrap}#surface{width:100%;max-height:950px;overflow:auto}iframe{display:block;border:1px solid #456;background:#050e1c}</style>
<header><button id="stability">Run mobile narration & chrome stability</button><button id="matrix">Run responsive layout matrix</button><button id="native">Run real MP3 playback checks</button><label>Inspect <select id="size"><option>390×724</option><option>320×568</option><option>393×652</option><option>430×760</option><option>844×390</option><option>1348×936</option></select></label><button id="caption">Show cloud row</button><button id="cards">Show expertise cards</button><button id="inquiry">Open inquiry after intro</button></header>
<pre id="results" role="status">Ready. Layout/native tests use the actual homepage and supplied MP3s. Frame widths and CSS zoom are simulations, not physical iOS/Messenger tests.</pre><div id="surface"><iframe id="page" title="V16.2 actual homepage viewport" src="/"></iframe></div>
<script type="module">
const frame=document.querySelector('#page'),out=document.querySelector('#results');const wait=ms=>new Promise(r=>setTimeout(r,ms));const log=s=>out.textContent+='\n'+s;function assert(ok,s){if(!ok)throw Error('FAIL: '+s);log('PASS: '+s)}const near=(a,b)=>Math.abs(a-b)<1.3;
async function until(fn,ms=23000){const t=Date.now();while(!fn()){if(Date.now()-t>ms)throw Error('timeout');await wait(20)}}
function viewport(w,h,z=1){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.zoom=z}
viewport(390,724);
async function load(){const id=Date.now();frame.src='/?v162-layout='+id;await until(()=>frame.contentDocument?.URL.includes('v162-layout='+id)&&frame.contentDocument?.querySelector('.talking-mascot'));const d=frame.contentDocument;await d.fonts.ready;return d}
function overlap(a,b){return a.left<b.right-1&&a.right>b.left+1&&a.top<b.bottom-1&&a.bottom>b.top+1}
function geometry(d,label){const bubble=d.querySelector('.mascot-bubble'),root=d.querySelector('.talking-mascot'),art=d.querySelector('.mascot-character'),copy=d.querySelector('.portfolio-hero-copy');if(!bubble)return;
 const r=bubble.getBoundingClientRect(),a=art.getBoundingClientRect(),c=copy.getBoundingClientRect(),rail=d.querySelector('.mascot-caption-space').getBoundingClientRect();
 assert(r.left>=0&&r.right<=d.documentElement.clientWidth+1,label+' cloud stays horizontally inside viewport');assert(!overlap(r,c),label+' cloud does not cover hero text or CTAs');
 const visible={left:a.left+a.width*.08,right:a.right-a.width*.08,top:a.top+a.height*.04,bottom:a.bottom-a.height*.04};assert(!overlap(r,visible),label+' cloud clear of face/hands/body');
 assert(r.top>=rail.top-1&&r.bottom<=rail.bottom+1,label+' cloud is inside its own measured layout rail');if(d.defaultView.innerWidth<=540)assert(r.bottom<=a.top+1,label+' mobile cloud stays above character');
 assert(d.defaultView.getComputedStyle(bubble).transform==='none',label+' no viewport/focus translation');assert(root.querySelectorAll('audio').length===1,label+' single media element');
 assert([...bubble.querySelectorAll('p,.mascot-contact')].every(e=>e.scrollHeight<=e.clientHeight+1),label+' captions/CTA wrap without clipping');
}
function showCaption(d){const r=d.querySelector('.mascot-caption-space').getBoundingClientRect(),n=d.querySelector('.portfolio-navbar-wrap').getBoundingClientRect();d.defaultView.scrollBy({top:r.top-n.bottom-12,behavior:'instant'})}
const size=document.querySelector('#size');size.onchange=()=>{const[w,h]=size.value.split('×').map(Number);viewport(w,h)};
document.querySelector('#caption').onclick=()=>showCaption(frame.contentDocument);document.querySelector('#cards').onclick=()=>frame.contentDocument.querySelector('.portfolio-focus-grid').scrollIntoView({block:'center'});document.querySelector('#inquiry').onclick=()=>{const d=frame.contentDocument;showCaption(d);d.querySelector('.mascot-character').focus({preventScroll:true})};
document.querySelector('#stability').onclick=async()=>{out.textContent='Actual mobile narration and changing embedded-browser height';try{viewport(390,724);const d=await load(),w=d.defaultView,root=d.querySelector('.talking-mascot'),a=d.querySelector('audio');await until(()=>d.querySelector('.mascot-bubble'));const docTop=e=>e.getBoundingClientRect().top+w.scrollY;const initial={top:docTop(root),height:root.getBoundingClientRect().height,character:docTop(d.querySelector('.mascot-character')),copy:docTop(d.querySelector('.portfolio-hero-copy'))};
 const states=new Set(),keys=new Set();await until(()=>{const pose=root.dataset.state;states.add(pose);if(d.querySelector('.mascot-bubble--inquiry'))throw Error('early inquiry');const key=pose+d.querySelector('.mascot-bubble p')?.textContent;if(!keys.has(key)&&d.querySelector('.mascot-bubble')){geometry(d,pose);keys.add(key)}if(!near(root.getBoundingClientRect().height,initial.height)||!near(docTop(root),initial.top)||!near(docTop(d.querySelector('.mascot-character')),initial.character))throw Error('layout jumped between captions');return root.dataset.introComplete==='true'});
 assert(a.paused&&a.currentTime===0,'silent first visit never starts audio');assert(['greeting','explaining','closing','idle'].every(s=>states.has(s)),'all actual-recording-time visual states observed');assert(!d.querySelector('.mascot-bubble--inquiry'),'inquiry hidden on completion until interaction');assert(near(docTop(d.querySelector('.portfolio-hero-copy')),initial.copy),'hero/copy stays stable across the intro');
 const c=d.querySelector('.mascot-character');c.focus({preventScroll:true});await wait(60);geometry(d,'inquiry');for(const h of [600,780,652,724]){viewport(390,h);await wait(80);assert(near(docTop(root),initial.top)&&near(root.getBoundingClientRect().height,initial.height)&&near(docTop(c),initial.character),'390×'+h+' browser-chrome height change does not move stage/character');geometry(d,'390×'+h)}
 for(const y of [0,450,900,1200]){w.scrollTo({top:y,behavior:'instant'});await wait(60);geometry(d,'scroll '+y);assert(near(docTop(root),initial.top),'scroll '+y+' preserves document-flow placement')}
 log('DONE: mobile narration/chrome stability');}catch(e){log(e.stack)}};
document.querySelector('#matrix').onclick=async()=>{out.textContent='Actual homepage layout matrix (CSS zoom simulations)';try{viewport(1348,936);const d=await load();await until(()=>d.querySelector('.talking-mascot').dataset.introComplete==='true');const sizes=[[1920,1080],[1440,900],[1280,800],[1100,800],[1024,768],[834,900],[768,900],[600,700],[568,320],[844,390],[540,720],[430,760],[414,736],[393,652],[390,724],[375,667],[360,640],[320,568]];let cases=0;
 for(const[w,h]of sizes)for(const z of [.8,.9,1,1.25]){viewport(w,h,z);await wait(70);const label=w+'×'+h+' / '+z*100+'%',c=d.querySelector('.mascot-character');c.blur();await wait(20);d.defaultView.scrollTo({top:0,behavior:'instant'});c.focus({preventScroll:true});await wait(70);geometry(d,label);assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,label+' no horizontal overflow');
 showCaption(d);await wait(50);const b=d.querySelector('.mascot-bubble').getBoundingClientRect(),nav=d.querySelector('.portfolio-navbar-wrap').getBoundingClientRect();assert(b.top>=nav.bottom+8&&b.height<=d.defaultView.innerHeight-nav.height-15,label+' full cloud can be read below navigation');c.blur();await wait(20);
 const grid=d.querySelector('.portfolio-focus-grid'),cards=[...grid.children],columns=w>1100?4:w>540?2:1;grid.scrollIntoView({block:'center',behavior:'instant'});await wait(90);assert(d.defaultView.getComputedStyle(grid).gridTemplateColumns.split(' ').length===columns,label+' expertise column count '+columns);
 for(let i=0;i<cards.length;i+=columns){const row=cards.slice(i,i+columns),rects=row.map(e=>e.getBoundingClientRect());assert(rects.every(r=>near(r.height,rects[0].height)),label+' equal card row heights');for(const s of ['.portfolio-focus-icon','h3','p']){const offsets=row.map(e=>e.querySelector(s).getBoundingClientRect().top-e.getBoundingClientRect().top);assert(offsets.every(x=>near(x,offsets[0])),label+' aligned '+s)}const bottoms=row.map(e=>e.getBoundingClientRect().bottom-e.querySelector('.portfolio-chip-row').getBoundingClientRect().bottom);assert(bottoms.every(x=>near(x,bottoms[0])),label+' bottom-aligned tags')}
 assert(cards.every(e=>e.querySelector('p').scrollHeight<=e.querySelector('p').clientHeight+1),label+' descriptions not clipped');cases++;
 }viewport(390,724);d.defaultView.scrollTo({top:0,behavior:'instant'});log('DONE: '+cases+' responsive combinations');}catch(e){log(e.stack)}};
document.querySelector('#native').onclick=async()=>{out.textContent='Real supplied MP3s / actual HTMLAudioElement';try{viewport(1348,936);const d=await load(),w=d.defaultView,root=d.querySelector('.talking-mascot'),voice=d.querySelector('.mascot-audio-toggle'),a=d.querySelector('audio');await until(()=>d.querySelector('.mascot-bubble'));assert(a.paused&&a.currentTime===0,'autoplay-restricted initial visit is silent');
 voice.click();assert(a.currentTime<.2&&root.dataset.introComplete!=='true','Voice on starts from zero');await until(()=>!a.paused&&a.currentTime>.15,5000);assert(a.currentSrc.endsWith('audio/v16.2/mascot-intro.mp3'),'real local introduction asset is selected');
 const t=a.currentTime;w.scrollTo({top:1000,behavior:'instant'});await wait(350);assert(!a.paused&&a.currentTime>t,'actual MP3 clock progresses during immediate scrolling away');w.scrollTo({top:0,behavior:'instant'});await wait(180);assert(!a.paused,'actual MP3 stays active while scrolling back');
 a.currentTime=7;await wait(120);voice.click();await wait(90);assert(a.paused&&d.querySelector('.mascot-face-rig').dataset.mouth==='rest','mute midway pauses real media and closes mouth');
 const y=w.scrollY;voice.click();assert(a.currentTime<.2,'unmute resets real media to zero');await until(()=>!a.paused&&a.currentTime>.1,5000);assert(w.scrollY===y,'starting audio causes no automatic page scroll');assert(d.querySelectorAll('audio').length===1,'single native audio element across restarts');
 a.currentTime=15.1;await until(()=>root.dataset.introComplete==='true',3000);assert(a.ended&&root.dataset.state==='idle','actual ended event completes intro and returns to idle');assert(!d.querySelector('.mascot-bubble--inquiry'),'audio completion does not automatically open inquiry');voice.click();voice.click();assert(a.currentTime<.2,'Voice on after completion starts intro again');await until(()=>!a.paused&&a.currentTime>.1,5000);a.currentTime=15.1;await until(()=>root.dataset.introComplete==='true',3000);voice.click();
 d.querySelector('.mascot-character').focus({preventScroll:true});await wait(70);assert(!!d.querySelector('.mascot-bubble--inquiry'),'intentional post-intro inquiry opens');voice.click();await until(()=>!a.paused&&a.currentTime>.1,5000);assert(a.currentSrc.endsWith('audio/v16.2/mascot-inquiry.mp3'),'Voice on in inquiry uses real approved inquiry MP3');
 const q=a.currentTime;d.querySelector('.mascot-character').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));w.scrollTo({top:1200,behavior:'instant'});await wait(300);assert(!a.paused&&a.currentTime>q,'real inquiry audio survives dismissal and scrolling');a.currentTime=4.6;await until(()=>a.ended,2000);assert(d.querySelector('.mascot-face-rig').dataset.mouth==='rest','inquiry end rests mouth');
 voice.click();voice.click();await until(()=>!a.paused,5000);const old=a;frame.src='/ghl-project/flowdesk-support-ticketing-automation';await until(()=>frame.contentDocument?.querySelector('.fd-case-page'));assert(old.paused,'navigating away stops native audio');log('DONE: real MP3 playback checks (end checks seek near clip end)');}catch(e){log(e.stack)}};
</script></html>
